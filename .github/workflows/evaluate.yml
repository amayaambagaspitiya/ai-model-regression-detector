name: LLM Regression Evaluation

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  evaluate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run evaluation
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          python evals/run_evaluation.py \
            --prompt prompts/email_classifier_v2.txt \
            --model llama-3.1-8b-instant \
            --output results/ci_current_results.json

      - name: Compare against baseline
        run: |
          python evals/compare_results.py \
            --baseline results/baseline_results.json \
            --current results/ci_current_results.json
